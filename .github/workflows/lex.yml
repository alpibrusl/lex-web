name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pull the pre-built lex binary that matches the lex.toml pin
      # (lex = "0.11.71"). Building from source on every PR would add
      # 6-8 minutes for no benefit; the release tarball is the same
      # binary tested upstream.
      - name: Install Lex toolchain
        run: |
          set -euxo pipefail
          LEX_VERSION="0.11.71"
          curl -fsSL -o /tmp/lex.tgz \
            "https://github.com/alpibrusl/lex-lang/releases/download/v${LEX_VERSION}/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lex.tgz -C /tmp/
          # Prepend the extracted dir to PATH for subsequent steps via
          # $GITHUB_PATH (avoids needing sudo to drop into /usr/local/bin).
          echo "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          # Run the version check directly from the extracted path —
          # this step's PATH addition only takes effect in *subsequent*
          # steps, not the current one.
          "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu/lex" --version

      - name: Install package dependencies (lex-schema / lex-crypto / lex-orm)
        run: lex pkg install

      # Per-file check so a single failure doesn't mask the rest, and
      # so the log shows exactly which file is red.
      - name: Type-check src/
        run: |
          set -e
          fail=0
          for f in src/*.lex; do
            if ! lex check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::lex check failed"
              lex check "$f" 2>&1 | head -3
              fail=1
            fi
          done
          exit $fail

      - name: Format check
        run: lex fmt --check src/ tests/ bench/servers/

      # `lex test` runs each tests/test_*.lex's `run_all` under the
      # widest sane effect set — see the file-level shim comments for
      # why every run_all panics on failure rather than returning Err.
      - name: Test
        run: lex test --allow-effects io,time,crypto,random,sql,fs_read,fs_write,net,concurrent,llm,proc,approval tests/

      # The pure tier's whole point is a minimal grant. `lex test` above
      # runs under the widest set and would not notice a regression;
      # `lex run` enforces the policy, so these two fail if router_pure's
      # import graph ever picks up an effect-bearing module.
      - name: Pure router needs no effects
        run: lex run tests/test_router_pure.lex run_all

      # dispatch_with takes the caller's effect row (#59): a service whose
      # resolver is [sql] runs under `sql` alone, and a grant without it
      # is refused. router.dispatch would demand all twelve effects.
      - name: dispatch_with runs under the resolver's row only
        run: |
          set -euo pipefail
          lex run --allow-effects sql tests/test_dispatch_with_sql.lex run_all
          if lex run --allow-effects net tests/test_dispatch_with_sql.lex run_all >/dev/null 2>&1; then
            echo "expected a grant without sql to be refused"; exit 1
          fi

      - name: Pure service serves under --allow-effects net only
        run: |
          set -euo pipefail
          lex run --allow-effects net examples/minimal_api.lex main > /tmp/minimal_api.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8083/quote/lex > /tmp/quote.json 2>/dev/null && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          cat /tmp/minimal_api.log
          grep -q '"symbol":"lex"' /tmp/quote.json
